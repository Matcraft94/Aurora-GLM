name: docs

# Build Sphinx documentation and deploy to GitHub Pages.
# Requires GitHub Pages configured with Source = "GitHub Actions"
# (Settings > Pages > Build and deployment > Source).

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'aurora/**'
      - 'pyproject.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install package with docs extras
        run: pip install -e ".[docs]"

      - name: Build Sphinx documentation
        run: sphinx-build -b html docs docs/_build/html
        env:
          # Fail on warnings so broken references never deploy silently
          SPHINXOPTS: '-W --keep-going'

      - name: Add .nojekyll
        run: touch docs/_build/html/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
