[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-glm"
version = "0.2.0.dev0"
description = "Aurora-GLM: generalized linear modeling toolkit with multi-backend support"
authors = [{name = "Lucy E. Arias", email = "mat.eduardo.arias@outlook.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["glm", "statistics", "machine learning", "multi-backend"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.8",
  "pandas>=1.4",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
torch = ["torch>=2.1", "torchvision>=0.16"]
jax = ["jax>=0.4", "jaxlib>=0.4"]

[project.urls]
Homepage = "https://github.com/Matcraft94/Aurora-GLM"
Repository = "https://github.com/Matcraft94/Aurora-GLM"
Documentation = "https://github.com/Matcraft94/Aurora-GLM"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["aurora*"]